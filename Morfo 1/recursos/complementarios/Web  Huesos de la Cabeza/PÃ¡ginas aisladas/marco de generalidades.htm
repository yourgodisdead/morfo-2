<SCRIPT LANGUAGE="JavaScript">

function evalua(botones,arreglo) {
  var suma = 0
  for (i=0; i<10; i++){
    if (botones[i].checked == arreglo[i]){
       suma++;     
     }
  }
  if (suma < 6){
    suma = 2;
    }
   else{
     if (suma < 8){
      suma = 3;
       }
         else{
           if (suma < 9){
             suma = 4;
             }
             else{
               suma = 5;
                }
           }
        }    
  return suma; 
}
